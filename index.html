<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Work-FlowEnglish · Học từ vựng tiếng Anh với AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Design tokens. Colours are CSS variables (see :root / .dark below) so one
    // class such as `bg-srs-mastered/15` or `text-rate-again-fg` works in both
    // themes. JS-side mapping from levels/ratings to classes: components/ui/srsTheme.ts
    (function () {
      const v = (name) => `rgb(var(--${name}) / <alpha-value>)`;
      const tone = (name, withSolid) => Object.assign(
        { DEFAULT: v(name), fg: v(`${name}-fg`) },
        withSolid ? { solid: v(`${name}-solid`) } : {},
      );
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              srs: {
                new: tone('srs-new'),
                learning: tone('srs-learning'),
                reviewing: tone('srs-reviewing'),
                mastered: tone('srs-mastered'),
                lapsed: tone('srs-lapsed'),
                suspended: tone('srs-suspended'),
              },
              rate: {
                again: tone('rate-again', true),
                hard: tone('rate-hard', true),
                good: tone('rate-good', true),
                easy: tone('rate-easy', true),
              },
            },
            fontSize: {
              'display': ['1.875rem', { lineHeight: '2.25rem', fontWeight: '700' }],
              'title': ['1.25rem', { lineHeight: '1.75rem', fontWeight: '700' }],
              'heading': ['1rem', { lineHeight: '1.5rem', fontWeight: '600' }],
              'caption': ['0.75rem', { lineHeight: '1rem' }],
            },
            boxShadow: {
              'card': '0 1px 2px 0 rgb(15 23 42 / 0.06), 0 1px 3px 0 rgb(15 23 42 / 0.08)',
              'raised': '0 10px 25px -5px rgb(15 23 42 / 0.12), 0 4px 10px -6px rgb(15 23 42 / 0.10)',
            },
            minHeight: { 'touch': '44px' },
            minWidth: { 'touch': '44px' },
          }
        }
      };
    })();
  </script>
  <link rel="icon" type="image/png" href="/avatarandlogo.png" />

  <link rel="apple-touch-icon" href="/avatarandlogo.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/avatarandlogo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/avatarandlogo.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/avatarandlogo.png" />
  
  <!-- Apple Mobile Web App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Work-FlowEnglish" />

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Design tokens: RGB triplets, consumed via tailwind.config above ───
       DEFAULT = vivid tone for dots, bars, borders and tinted backgrounds.
       fg      = text on a light (or, in .dark, dark) surface; meets WCAG AA.
       solid   = button background under white text; meets WCAG AA. */
    :root {
      --srs-new: 100 116 139;          --srs-new-fg: 51 65 85;
      --srs-learning: 245 158 11;      --srs-learning-fg: 180 83 9;
      --srs-reviewing: 59 130 246;     --srs-reviewing-fg: 29 78 216;
      --srs-mastered: 16 185 129;      --srs-mastered-fg: 4 120 87;
      --srs-lapsed: 244 63 94;         --srs-lapsed-fg: 190 18 60;
      --srs-suspended: 113 113 122;    --srs-suspended-fg: 63 63 70;

      --rate-again: 239 68 68;   --rate-again-fg: 185 28 28;   --rate-again-solid: 220 38 38;
      --rate-hard: 249 115 22;   --rate-hard-fg: 194 65 12;    --rate-hard-solid: 194 65 12;
      --rate-good: 59 130 246;   --rate-good-fg: 29 78 216;    --rate-good-solid: 37 99 235;
      --rate-easy: 16 185 129;   --rate-easy-fg: 4 120 87;     --rate-easy-solid: 4 120 87;
    }

    .dark {
      --srs-new: 148 163 184;          --srs-new-fg: 203 213 225;
      --srs-learning: 251 191 36;      --srs-learning-fg: 252 211 77;
      --srs-reviewing: 96 165 250;     --srs-reviewing-fg: 147 197 253;
      --srs-mastered: 52 211 153;      --srs-mastered-fg: 110 231 183;
      --srs-lapsed: 251 113 133;       --srs-lapsed-fg: 253 164 175;
      --srs-suspended: 161 161 170;    --srs-suspended-fg: 212 212 216;

      --rate-again: 248 113 113; --rate-again-fg: 252 165 165;
      --rate-hard: 251 146 60;   --rate-hard-fg: 253 186 116;
      --rate-good: 96 165 250;   --rate-good-fg: 147 197 253;
      --rate-easy: 52 211 153;   --rate-easy-fg: 110 231 183;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }

    .dark body {
      background-color: #0f172a;
    }

    /* Keyboard focus is always visible; mouse clicks don't draw a ring. */
    :focus-visible {
      outline: 2px solid rgb(59 130 246);
      outline-offset: 2px;
    }

    /* Respect the OS "reduce motion" setting: no card flips, fly-outs or
       looping animations, state changes happen instantly. */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Bottom sheet / side panel entrance (components/ui/Sheet.tsx) */
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes sheetLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .anim-sheet-up {
      animation: sheetUp 0.25s ease-out;
    }

    @media (min-width: 768px) {
      .anim-sheet-up {
        animation: sheetLeft 0.25s ease-out;
      }
    }

    /* Skeleton shimmer (components/ui/Skeleton.tsx) */
    @keyframes skeletonPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .anim-skeleton {
      animation: skeletonPulse 1.6s ease-in-out infinite;
    }

    /* Hide scrollbars on horizontally scrolling chip rows */
    .scrollbar-none {
      scrollbar-width: none;
    }

    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }

    /* Safe-area padding for the fixed bottom navigation on notched phones */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Flip Card Utilities */
    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Landing Page Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    @keyframes pulseGlow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      }

      50% {
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.6);
      }
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(60px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Toast slide-down + fade animation */
    @keyframes toastSlideDown {
      from {
        opacity: 0;
        transform: translate(-50%, -24px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .anim-toast-in {
      animation: toastSlideDown 0.3s ease-out forwards;
    }

    .anim-fade-up {
      animation: fadeInUp 0.8s ease forwards;
      opacity: 0;
    }

    .anim-fade-up-d1 {
      animation-delay: 0.1s;
    }

    .anim-fade-up-d2 {
      animation-delay: 0.2s;
    }

    .anim-fade-up-d3 {
      animation-delay: 0.3s;
    }

    .anim-fade-up-d4 {
      animation-delay: 0.4s;
    }

    .anim-fade-up-d5 {
      animation-delay: 0.5s;
    }

    .anim-float {
      animation: float 6s ease-in-out infinite;
    }

    .anim-pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .anim-scale-in {
      animation: scaleIn 0.6s ease forwards;
      opacity: 0;
    }

    .anim-gradient {
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
    }

    /* IELTS Recording pulse */
    @keyframes recordPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
      }
    }

    .anim-record-pulse {
      animation: recordPulse 1.5s ease-in-out infinite;
    }

    /* IELTS Score reveal */
    @keyframes scoreReveal {
      from {
        opacity: 0;
        transform: scale(0.5) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .anim-score-reveal {
      animation: scoreReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* IELTS Feedback card slide-in */
    @keyframes feedbackSlideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .anim-feedback-in {
      animation: feedbackSlideIn 0.4s ease-out forwards;
      opacity: 0;
    }

    /* ─── ChatBox Animations ─── */

    @keyframes chatFabPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    .anim-chat-fab-pulse {
      animation: chatFabPulse 2.5s ease-in-out infinite;
    }

    @keyframes chatSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .anim-chat-slide-up {
      animation: chatSlideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes chatMsgIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .anim-chat-msg-in {
      animation: chatMsgIn 0.25s ease-out forwards;
    }

    @keyframes typingDot {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .anim-typing-dot {
      animation: typingDot 1.2s ease-in-out infinite;
    }

    @keyframes waveformBar {
      0%, 100% {
        height: 6px;
      }
      50% {
        height: 20px;
      }
    }

    .anim-waveform {
      animation: waveformBar 0.8s ease-in-out infinite alternate;
    }
  </style>

{

  }
}
</script>
