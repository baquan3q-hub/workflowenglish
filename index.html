<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Work-FlowEnglish · Học từ vựng tiếng Anh với AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Design tokens. Colours are CSS variables (see :root / .dark below) so one
    // class such as `bg-srs-mastered/15` or `text-rate-again-fg` works in both
    // themes. JS-side mapping from levels/ratings to classes: components/ui/srsTheme.ts
    (function () {
      const v = (name) => `rgb(var(--${name}) / <alpha-value>)`;
      const tone = (name, withSolid) => Object.assign(
        { DEFAULT: v(name), fg: v(`${name}-fg`) },
        withSolid ? { solid: v(`${name}-solid`) } : {},
      );
      // Pastel tones (components/ui/palette.ts): `bg-tone-sky`, `bg-tone-sky-soft`,
      // `text-tone-sky-fg`, `border-tone-sky-border`.
      const pastel = (name) => ({
        DEFAULT: v(`tone-${name}-bg`),
        soft: v(`tone-${name}-soft`),
        fg: v(`tone-${name}-fg`),
        border: v(`tone-${name}-border`),
        accent: v(`tone-${name}-accent`),
      });
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              srs: {
                new: tone('srs-new'),
                learning: tone('srs-learning'),
                reviewing: tone('srs-reviewing'),
                mastered: tone('srs-mastered'),
                lapsed: tone('srs-lapsed'),
                suspended: tone('srs-suspended'),
              },
              rate: {
                again: tone('rate-again', true),
                hard: tone('rate-hard', true),
                good: tone('rate-good', true),
                easy: tone('rate-easy', true),
              },
              tone: {
                sky: pastel('sky'),
                mint: pastel('mint'),
                lavender: pastel('lavender'),
                peach: pastel('peach'),
                butter: pastel('butter'),
                aqua: pastel('aqua'),
                blush: pastel('blush'),
                periwinkle: pastel('periwinkle'),
              },
            },
            fontSize: {
              'display': ['1.875rem', { lineHeight: '2.25rem', fontWeight: '700' }],
              'title': ['1.25rem', { lineHeight: '1.75rem', fontWeight: '700' }],
              'heading': ['1rem', { lineHeight: '1.5rem', fontWeight: '600' }],
              'caption': ['0.75rem', { lineHeight: '1rem' }],
            },
            boxShadow: {
              'card': '0 1px 2px 0 rgb(15 23 42 / 0.06), 0 1px 3px 0 rgb(15 23 42 / 0.08)',
              'raised': '0 10px 25px -5px rgb(15 23 42 / 0.12), 0 4px 10px -6px rgb(15 23 42 / 0.10)',
            },
            minHeight: { 'touch': '44px' },
            minWidth: { 'touch': '44px' },
          }
        }
      };
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Design tokens: RGB triplets, consumed via tailwind.config above ───
       DEFAULT = vivid tone for dots, bars, borders and tinted backgrounds.
       fg      = text on a light (or, in .dark, dark) surface; meets WCAG AA.
       solid   = button background under white text; meets WCAG AA. */
    :root {
      --srs-new: 100 116 139;          --srs-new-fg: 51 65 85;
      --srs-learning: 245 158 11;      --srs-learning-fg: 180 83 9;
      --srs-reviewing: 59 130 246;     --srs-reviewing-fg: 29 78 216;
      --srs-mastered: 16 185 129;      --srs-mastered-fg: 4 120 87;
      --srs-lapsed: 244 63 94;         --srs-lapsed-fg: 190 18 60;
      --srs-suspended: 113 113 122;    --srs-suspended-fg: 63 63 70;

      --rate-again: 239 68 68;   --rate-again-fg: 185 28 28;   --rate-again-solid: 220 38 38;
      --rate-hard: 249 115 22;   --rate-hard-fg: 194 65 12;    --rate-hard-solid: 194 65 12;
      --rate-good: 59 130 246;   --rate-good-fg: 29 78 216;    --rate-good-solid: 37 99 235;
      --rate-easy: 16 185 129;   --rate-easy-fg: 4 120 87;     --rate-easy-solid: 4 120 87;

      /* Pastel tones. Source of truth: TONE_RGB in components/ui/palette.ts
         (a test keeps this copy in sync and checks fg contrast >= 4.5:1).
         bg = card tint, soft = tile/chip/button, fg = text, border = outline/hover,
         accent = bar/dot fill. */
      --tone-sky-bg: 240 249 255; --tone-sky-soft: 224 242 254; --tone-sky-fg: 7 89 133; --tone-sky-border: 186 230 253; --tone-sky-accent: 56 189 248;
      --tone-mint-bg: 236 253 245; --tone-mint-soft: 209 250 229; --tone-mint-fg: 6 95 70; --tone-mint-border: 167 243 208; --tone-mint-accent: 52 211 153;
      --tone-lavender-bg: 245 243 255; --tone-lavender-soft: 237 233 254; --tone-lavender-fg: 91 33 182; --tone-lavender-border: 221 214 254; --tone-lavender-accent: 167 139 250;
      --tone-peach-bg: 255 247 237; --tone-peach-soft: 255 237 213; --tone-peach-fg: 154 52 18; --tone-peach-border: 254 215 170; --tone-peach-accent: 251 146 60;
      --tone-butter-bg: 254 252 232; --tone-butter-soft: 254 249 195; --tone-butter-fg: 133 77 14; --tone-butter-border: 254 240 138; --tone-butter-accent: 250 204 21;
      --tone-aqua-bg: 240 253 250; --tone-aqua-soft: 204 251 241; --tone-aqua-fg: 17 94 89; --tone-aqua-border: 153 246 228; --tone-aqua-accent: 45 212 191;
      --tone-blush-bg: 253 242 248; --tone-blush-soft: 252 231 243; --tone-blush-fg: 157 23 77; --tone-blush-border: 251 207 232; --tone-blush-accent: 244 114 182;
      --tone-periwinkle-bg: 238 242 255; --tone-periwinkle-soft: 224 231 255; --tone-periwinkle-fg: 55 48 163; --tone-periwinkle-border: 199 210 254; --tone-periwinkle-accent: 129 140 248;
    }

    .dark {
      --srs-new: 148 163 184;          --srs-new-fg: 203 213 225;
      --srs-learning: 251 191 36;      --srs-learning-fg: 252 211 77;
      --srs-reviewing: 96 165 250;     --srs-reviewing-fg: 147 197 253;
      --srs-mastered: 52 211 153;      --srs-mastered-fg: 110 231 183;
      --srs-lapsed: 251 113 133;       --srs-lapsed-fg: 253 164 175;
      --srs-suspended: 161 161 170;    --srs-suspended-fg: 212 212 216;

      --rate-again: 248 113 113; --rate-again-fg: 252 165 165;
      --rate-hard: 251 146 60;   --rate-hard-fg: 253 186 116;
      --rate-good: 96 165 250;   --rate-good-fg: 147 197 253;
      --rate-easy: 52 211 153;   --rate-easy-fg: 110 231 183;

      --tone-sky-bg: 20 43 67; --tone-sky-soft: 23 56 83; --tone-sky-fg: 186 230 253; --tone-sky-border: 31 89 124; --tone-sky-accent: 56 189 248;
      --tone-mint-bg: 19 46 55; --tone-mint-soft: 22 61 64; --tone-mint-fg: 167 243 208; --tone-mint-border: 30 98 86; --tone-mint-accent: 52 211 153;
      --tone-lavender-bg: 33 37 67; --tone-lavender-soft: 45 46 84; --tone-lavender-fg: 221 214 254; --tone-lavender-border: 76 69 125; --tone-lavender-accent: 167 139 250;
      --tone-peach-bg: 43 38 44; --tone-peach-soft: 62 48 46; --tone-peach-fg: 254 215 170; --tone-peach-border: 109 72 49; --tone-peach-accent: 251 146 60;
      --tone-butter-bg: 43 45 39; --tone-butter-soft: 62 59 38; --tone-butter-fg: 254 240 138; --tone-butter-border: 109 95 34; --tone-butter-accent: 250 204 21;
      --tone-aqua-bg: 19 46 60; --tone-aqua-soft: 21 61 72; --tone-aqua-fg: 153 246 228; --tone-aqua-border: 27 99 102; --tone-aqua-accent: 45 212 191;
      --tone-blush-bg: 42 34 59; --tone-blush-soft: 61 41 70; --tone-blush-fg: 251 207 232; --tone-blush-border: 107 59 98; --tone-blush-accent: 244 114 182;
      --tone-periwinkle-bg: 29 37 67; --tone-periwinkle-soft: 38 46 83; --tone-periwinkle-fg: 199 210 254; --tone-periwinkle-border: 61 70 124; --tone-periwinkle-accent: 129 140 248;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }

    .dark body {
      background-color: #0f172a;
    }

    /* Keyboard focus is always visible; mouse clicks don't draw a ring. */
    :focus-visible {
      /* Periwinkle fg: dark in light mode, light in dark mode, AA on every surface. */
      outline: 2px solid rgb(var(--tone-periwinkle-fg));
      outline-offset: 2px;
    }

    /* Respect the OS "reduce motion" setting: no card flips, fly-outs or
       looping animations, state changes happen instantly. */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Hover motion for interactive surfaces (the reduced-motion rule above
       turns these into instant state changes).
       .lift      rises 2px and gains the raised shadow on hover
       .press     shrinks slightly while pressed
       .icon-pop  grows and tilts when its .group parent is hovered or focused */
    .lift,
    .press,
    .icon-pop {
      transition-property: translate, scale, rotate, box-shadow, background-color, border-color, color;
      transition-duration: 180ms;
      transition-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @media (hover: hover) {
      .lift:hover {
        translate: 0 -2px;
        box-shadow: 0 10px 25px -5px rgb(15 23 42 / 0.12), 0 4px 10px -6px rgb(15 23 42 / 0.10);
      }
      .group:hover .icon-pop {
        scale: 1.1;
        rotate: -6deg;
      }
    }
    .group:focus-visible .icon-pop,
    .group:has(:focus-visible) .icon-pop {
      scale: 1.1;
      rotate: -6deg;
    }
    .press:active,
    .lift:active {
      translate: none;
      scale: 0.98;
    }

    /* Bottom sheet / side panel entrance (components/ui/Sheet.tsx) */
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes sheetLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .anim-sheet-up {
      animation: sheetUp 0.25s ease-out;
    }

    @media (min-width: 768px) {
      .anim-sheet-up {
        animation: sheetLeft 0.25s ease-out;
      }
    }

    /* Skeleton shimmer (components/ui/Skeleton.tsx) */
    @keyframes skeletonPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .anim-skeleton {
      animation: skeletonPulse 1.6s ease-in-out infinite;
    }

    /* Hide scrollbars on horizontally scrolling chip rows */
    .scrollbar-none {
      scrollbar-width: none;
    }

    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }

    /* Safe-area padding for the fixed bottom navigation on notched phones */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Flip Card Utilities */
    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Landing Page Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    @keyframes pulseGlow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      }

      50% {
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.6);
      }
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(60px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Toast slide-down + fade animation */
    @keyframes toastSlideDown {
      from {
        opacity: 0;
        transform: translate(-50%, -24px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .anim-toast-in {
      animation: toastSlideDown 0.3s ease-out forwards;
    }

    .anim-fade-up {
      animation: fadeInUp 0.8s ease forwards;
      opacity: 0;
    }

    .anim-fade-up-d1 {
      animation-delay: 0.1s;
    }

    .anim-fade-up-d2 {
      animation-delay: 0.2s;
    }

    .anim-fade-up-d3 {
      animation-delay: 0.3s;
    }

    .anim-fade-up-d4 {
      animation-delay: 0.4s;
    }

    .anim-fade-up-d5 {
      animation-delay: 0.5s;
    }

    .anim-float {
      animation: float 6s ease-in-out infinite;
    }

    .anim-pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .anim-scale-in {
      animation: scaleIn 0.6s ease forwards;
      opacity: 0;
    }

    .anim-gradient {
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
    }

    /* IELTS Recording pulse */
    @keyframes recordPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
      }
    }

    .anim-record-pulse {
      animation: recordPulse 1.5s ease-in-out infinite;
    }

    /* IELTS Score reveal */
    @keyframes scoreReveal {
      from {
        opacity: 0;
        transform: scale(0.5) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .anim-score-reveal {
      animation: scoreReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* IELTS Feedback card slide-in */
    @keyframes feedbackSlideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .anim-feedback-in {
      animation: feedbackSlideIn 0.4s ease-out forwards;
      opacity: 0;
    }

    /* ─── ChatBox Animations ─── */

    @keyframes chatFabPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    .anim-chat-fab-pulse {
      animation: chatFabPulse 2.5s ease-in-out infinite;
    }

    @keyframes chatSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .anim-chat-slide-up {
      animation: chatSlideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes chatMsgIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .anim-chat-msg-in {
      animation: chatMsgIn 0.25s ease-out forwards;
    }

    @keyframes typingDot {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .anim-typing-dot {
      animation: typingDot 1.2s ease-in-out infinite;
    }

    @keyframes waveformBar {
      0%, 100% {
        height: 6px;
      }
      50% {
        height: 20px;
      }
    }

    /* Chat: sliding bar while the AI is busy (length unknown) */
    @keyframes chatIndeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }

    .chat-indeterminate {
      animation: chatIndeterminate 1.2s ease-in-out infinite;
    }

    .chat-progress-fill {
      background-image: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.45), transparent);
      background-size: 50% 100%;
      background-repeat: no-repeat;
      animation: chatShimmer 1.4s linear infinite;
    }

    @keyframes chatShimmer {
      0% { background-position: -50% 0; }
      100% { background-position: 150% 0; }
    }

    /* Chat in full screen: word cards two per row */
    .chat-wide .chat-wide-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    @media (prefers-reduced-motion: reduce) {
      .chat-indeterminate, .chat-progress-fill, .anim-chat-fab-pulse { animation: none; }
    }

    .anim-waveform {
      animation: waveformBar 0.8s ease-in-out infinite alternate;
    }

    /* ─── Sui Overflow 2025/2026 Neo-Brutalist & 3D Isometric Styles ─── */
    .bg-blueprint-grid {
      background-color: #f8fafc;
      background-image: 
        linear-gradient(to right, rgba(37, 99, 235, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(37, 99, 235, 0.09) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .dark .bg-blueprint-grid {
      background-color: #090d16;
      background-image: 
        linear-gradient(to right, rgba(96, 165, 250, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(96, 165, 250, 0.08) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    @keyframes marqueeInfinite {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    /* Marquee Infinite Smooth Auto-moving Animation (Always moves, never paused) */
    @keyframes marqueeScrollX {
      0% {
        transform: translate3d(0, 0, 0);
        -webkit-transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-100%, 0, 0);
        -webkit-transform: translate3d(-100%, 0, 0);
      }
    }

    .anim-marquee-track {
      display: flex;
      flex-shrink: 0;
      min-width: 100%;
      align-items: center;
      animation: marqueeScrollX 22s linear infinite !important;
      -webkit-animation: marqueeScrollX 22s linear infinite !important;
      will-change: transform;
    }

    /* Keycaps Emotion Floating & Bobbing */
    @keyframes keycapBob1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-1.5deg); }
    }
    @keyframes keycapBob2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(1.5deg); }
    }
    @keyframes keycapBob3 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(-1deg); }
    }

    .anim-keycap-1 { animation: keycapBob1 3.2s ease-in-out infinite; }
    .anim-keycap-2 { animation: keycapBob2 2.8s ease-in-out infinite 0.4s; }
    .anim-keycap-3 { animation: keycapBob3 3.5s ease-in-out infinite 0.8s; }

    /* Emotion Eye Blinking Animation */
    @keyframes emotionBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    .anim-emotion-blink {
      transform-origin: center;
      animation: emotionBlink 3.8s ease-in-out infinite;
    }

    /* Frosted glass (glassPanel in components/ui/styles.ts): without
       backdrop-filter the see-through card would be hard to read, so make it
       nearly opaque instead. */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background-color: rgb(255 255 255 / 0.94) !important; }
      .dark .glass { background-color: rgb(15 23 42 / 0.94) !important; }
    }
  </style>
